name: CI

on:
  pull_request:
    branches: [main, foundation/phase-0]
  push:
    branches: [main, foundation/phase-0]

permissions:
  contents: read

jobs:
  foundation-validation:
    name: Foundation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON documents
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('All JSON documents are syntactically valid.')
          PY

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8.3" "jsonschema>=4.23"

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md PROJECT_STATE.md ROADMAP.md ARCHITECTURE.md; do
            test -f "$file"
          done
          test -f governance/decisions/ADR-0001-multi-agent-provenance-first-architecture.md
          test -f governance/decisions/ADR-0002-checkpoint-store-and-resumability.md
          test -f governance/decisions/ADR-0003-agent-runtime-governance.md
          test -f governance/decisions/ADR-0004-cooperative-execution-controls.md
          test -f agents/schemas/agent-contract.schema.json
          test -f agents/registry/foundation.agents.json
          test -f agents/registry/artifact-schemas.json
          test -f missions/schemas/mission.schema.json
          test -f missions/schemas/task.schema.json
          test -f data/schemas/provenance-record.schema.json

      - name: Validate registered agent contracts and artifact schemas
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from sanatana_ai.agents.governance import SchemaRegistry
          from sanatana_ai.agents.registry import load_registry

          root = Path('..')
          entries = load_registry(
              root / 'agents/registry/foundation.agents.json',
              root / 'agents/schemas/agent-contract.schema.json',
          )
          if not entries:
              raise SystemExit('agent registry must contain at least one agent')

          schemas = SchemaRegistry.from_registry(
              root / 'agents/registry/artifact-schemas.json', root
          )
          if not schemas:
              raise SystemExit('artifact schema registry must contain at least one schema')
          print(f'Validated {len(entries)} registered agent contracts and artifact schemas.')
          PY

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' . \
            --exclude-dir=.git --exclude='ci.yml'; then
            echo 'Potential credential material detected.'
            exit 1
          fi
