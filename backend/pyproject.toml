[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sanatana-ai"
version = "0.1.0"
description = "Provenance-first agentic knowledge engineering platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
